services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: omnilog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./millog_backend
      dockerfile: Dockerfile
    env_file:
      - /home/melkor/study/diploma/millog_backend/.env
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/omnilog?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ALLOW_BOOTSTRAP_OVERRIDE: ${ALLOW_BOOTSTRAP_OVERRIDE:-}
      FRONTEND_URL: ${FRONTEND_URL:-https://localhost}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./millog_frontend
      dockerfile: Dockerfile
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"     
      - "443:443"   
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config: